<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Widget — Dev Demo</title>
  <link rel="stylesheet" href="src/styles/widget.css">
</head>
<body style="margin:0; background:#fdfcfc; font-family: 'JetBrains Mono', monospace; padding:24px;">
  <div id="ai-support-widget"></div>
  <script src="dist/widget.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      window.__chatWidget = new ChatWidget({
        proxyUrl: 'http://localhost:8787/api/order-lookup',
        hmacSecret: 'your-hmac-secret-here',
        storeDomain: 'your-store.myshopify.com',
        storefrontToken: 'your-storefront-token',
        dataSource: { catalog: 'mock', order: 'mock', policy: 'mock' }
      });
    });
  </script>
</body>
</html>
